name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Load production environment
        run: cat deployment/prod/.env >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$NEXT_PUBLIC_API_BASE_URL"

      - name: Show AWS role details
        shell: bash
        run: |
          if [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws[a-zA-Z-]*:iam::([0-9]{12}):role/(.+)$ ]]; then
            echo "AWS account ID: ${BASH_REMATCH[1]}"
            echo "AWS role name: ${BASH_REMATCH[2]##*/}"
          else
            echo "AWS_DEPLOY_ROLE_ARN is not a valid IAM role ARN" >&2
            exit 1
          fi

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          OIDC_RESPONSE="$oidc_response" node <<'NODE'
          const response = JSON.parse(process.env.OIDC_RESPONSE);
          const tokenParts = response.value?.split('.');

          if (tokenParts?.length !== 3) {
            throw new Error('GitHub did not return a valid OIDC JWT');
          }

          const payload = JSON.parse(Buffer.from(tokenParts[1], 'base64url'));
          const claims = {
            sub: payload.sub,
            aud: payload.aud,
            repository: payload.repository,
            ref: payload.ref,
          };

          if (payload.environment !== undefined) {
            claims.environment = payload.environment;
          }

          console.log(JSON.stringify(claims, null, 2));
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static site to S3
        run: >-
          aws s3 sync out/ "s3://$AWS_S3_BUCKET/"
          --delete
          --cache-control "public, max-age=0, must-revalidate"

      - name: Apply immutable caching to Next.js assets
        run: >-
          aws s3 cp out/_next/static/ "s3://$AWS_S3_BUCKET/_next/static/"
          --recursive
          --cache-control "public, max-age=31536000, immutable"

      - name: Apply HTML content type and caching
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            key="${file#out/}"
            aws s3 cp "$file" "s3://$AWS_S3_BUCKET/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache"
          done < <(find out -type f -name '*.html' -print0)

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
