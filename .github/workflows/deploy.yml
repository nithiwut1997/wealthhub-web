name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-southeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$NEXT_PUBLIC_API_BASE_URL"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static site to S3
        run: >-
          aws s3 sync out/ "s3://$AWS_S3_BUCKET/"
          --delete
          --cache-control "public, max-age=0, must-revalidate"

      - name: Apply immutable caching to Next.js assets
        run: >-
          aws s3 cp out/_next/static/ "s3://$AWS_S3_BUCKET/_next/static/"
          --recursive
          --cache-control "public, max-age=31536000, immutable"

      - name: Apply HTML content type and caching
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            key="${file#out/}"
            aws s3 cp "$file" "s3://$AWS_S3_BUCKET/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache"
          done < <(find out -type f -name '*.html' -print0)

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
